<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10231c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Эвосфера — песочница эволюции</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2310231c'/%3E%3Cpath d='M32 50V30M32 34c-10 0-14-8-14-14 8 0 14 4 14 14zm0-6c0-8 5-13 13-13 0 8-5 13-13 13z' stroke='%239be36b' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="topbar">
    <button id="btn-menu" class="ib" aria-label="Меню">☰</button>
    <div id="date"><b id="d-date">Год 1</b><span id="d-sub">Весна</span></div>
    <div id="chips">
      <span class="chip" id="ch-weather">☀️ 15°</span>
      <span class="chip" id="ch-sp">🧬 0</span>
      <span class="chip" id="ch-an">🐾 0</span>
      <span class="chip" id="ch-pl">🌿 0</span>
    </div>
  </div>
  <div id="timebar">
    <button data-sp="0" aria-label="Пауза">⏸</button>
    <button data-sp="1" class="on">1×</button>
    <button data-sp="2">3×</button>
    <button data-sp="3">10×</button>
    <button data-sp="4">40×</button>
    <button id="btn-ff" aria-label="Перемотка">⏭</button>
  </div>
  <div id="goal" class="hidden"></div>
  <div id="banner" class="hidden"></div>
  <div id="inspector" class="hidden"></div>
  <div id="toasts"></div>
  <div id="sheet" class="hidden">
    <header><h2 id="sheet-title"></h2><button id="sheet-min" class="ib" aria-label="Свернуть">▾</button><button id="sheet-close" class="ib" aria-label="Закрыть">✕</button></header>
    <div id="sheet-tabs"></div>
    <div id="sheet-body"></div>
  </div>
  <nav id="nav">
    <button data-p="life"><i>🐾</i><span>Жизнь</span></button>
    <button data-p="create"><i>✏️</i><span>Создать</span></button>
    <button data-p="world"><i>🌍</i><span>Мир</span></button>
    <button data-p="stats"><i>📊</i><span>Данные</span></button>
    <button data-p="book"><i>📖</i><span>Книга</span></button>
  </nav>
</div>

<div id="editor" class="hidden">
  <div id="ed-top">
    <button id="ed-cancel" class="ib" aria-label="Назад">←</button>
    <input id="ed-name" type="text" maxlength="28" placeholder="Название вида" autocomplete="off">
    <button id="ed-save" class="btn primary">Готово</button>
  </div>
  <div id="ed-anim"></div>
  <div id="ed-panel">
    <div id="ed-tabs"></div>
    <div id="ed-body"></div>
    <div id="ed-summary"></div>
  </div>
</div>

<div id="menu">
  <div id="menu-card">
    <div id="logo"><div class="mark">🌱</div><h1>ЭВОСФЕРА</h1><p>песочница эволюции</p></div>
    <div id="menu-body"></div>
  </div>
</div>

<div id="modal" class="hidden"><div id="modal-card"></div></div>
<div id="progress" class="hidden"><div class="pc"><h3 id="pg-title">Перемотка времени…</h3><div class="bar"><i id="pg-bar"></i></div><p id="pg-text"></p><button id="pg-stop" class="btn">Остановить</button></div></div>
<div id="fatal" class="hidden"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
